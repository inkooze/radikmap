<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта РГРТУ - Редактор</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <header id="topbar">
    <div class="topbar-brand">
      <span class="topbar-title">Карта РГРТУ - Редактор</span>
    </div>
    <div class="topbar-divider"></div>
    <nav id="buildings" class="topbar-nav"></nav>
    <div class="topbar-actions">
      <button class="action-btn" id="btn-theme-toggle" title="Переключить тему">
        <i class="mdi mdi-weather-night"></i>
      </button>
      <button class="action-btn" id="editor-save" title="Сохранить graph.json">
        <i class="mdi mdi-content-save"></i>
      </button>
    </div>
  </header>

  <div id="app">
    <div id="map-wrap">
      <div id="map"></div>
      
      <!-- Нижний горизонтальный островок с инструментами -->
      <div id="bottom-toolbar" class="bottom-toolbar">
        <button class="tool-btn active" data-tool="add-node">
          <i class="mdi mdi-plus-circle"></i> Добавить узел
        </button>
        <button class="tool-btn" data-tool="add-edge">
          <i class="mdi mdi-vector-line"></i> Добавить ребро
        </button>
        <button class="tool-btn" data-tool="link-stairs">
          <i class="mdi mdi-stairs"></i> Связать лестницы
        </button>
        <button class="tool-btn" data-tool="select">
          <i class="mdi mdi-cursor-default"></i> Выделение
        </button>
      </div>

    </div>
    <aside id="editor-sidebar">
      <div class="editor-section">
        <h3>Информация об объекте</h3>
        <div id="node-info">
          <p class="muted">Кликните по узлу или ребру для выбора</p>
        </div>
      </div>

      <div class="editor-section">
        <h3>Горячие клавиши</h3>
        <ul class="hotkeys">
          <li><kbd>1</kbd> — добавить узел</li>
          <li><kbd>2</kbd> — добавить ребро</li>
          <li><kbd>3</kbd> — связать лестницы</li>
          <li><kbd>4</kbd> — выделение</li>
          <li><kbd>Esc</kbd> — снять выделение</li>
          <li><kbd>Del</kbd> — удалить выбранное</li>
        </ul>
      </div>
    </aside>
  </div>

  <button id="sidebar-handle" class="sidebar-handle" title="Свернуть / развернуть панель">
    <i class="mdi mdi-chevron-right"></i>
  </button>

  <!-- Универсальное модальное окно -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal-window">
      <div class="modal-header">
        <h2 id="modal-title">Заголовок</h2>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Контент динамически -->
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="modal-cancel">Отмена</button>
        <button class="btn-primary" id="modal-confirm">ОК</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
